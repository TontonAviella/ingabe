[project]
name = "mundi.ai"
version = "0.0.1"
description = "Mundi.ai is an open source web GIS"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "aioboto3==14.3.0",
    "aiohttp==3.14.1",
    "alembic==1.16.2",
    "apscheduler==3.11.0",
    "asyncpg==0.30.0",
    "beautifulsoup4==4.15.0",
    "boto3==1.37.3",
    "cdsapi==0.7.7",
    "dask==2024.12.1",
    "dagster==1.10.16",
    "dagster-postgres==0.26.16",
    "duckdb==1.5.4",
    "exactextract==0.2.2",
    "fastapi==0.139.0",
    "geopandas==1.1.3",
    "h3==4.1.0",
    "httpx==0.28.1",
    "httpx-ws==0.7.2",
    "laspy==2.6.1",
    "lazrs==0.7.0",
    "matplotlib==3.10.9",
    "numpy==2.2.6",
    "openai==2.36.0",
    "openpyxl==3.1.5",
    "opentelemetry-api==1.36.0",
    "opentelemetry-exporter-otlp-proto-http==1.36.0",
    "opentelemetry-sdk==1.36.0",
    "opentelemetry-instrumentation-asyncpg==0.57b0",
    "opentelemetry-instrumentation-httpx==0.57b0",
    "opentelemetry-instrumentation-requests==0.57b0",
    "pillow==12.2.0",
    "planetary-computer==1.0.0",
    # Pinned at 2.13.4 (bumped from 2.11.4 in May 2026); the app runs on it.
    # Pydantic 2.x keeps model definitions stable.
    "pydantic==2.13.4",
    "pydantic-settings==2.9.1",
    "pyarrow==23.0.1",
    "pyogrio==0.12.1",
    "pypdf==6.13.3",
    "pyproj==3.7.2",
    "pystac-client==0.7.7",
    "psycopg2-binary==2.9.9",
    "pytest==9.0.3",
    "python-multipart==0.0.31",
    "redis==6.1.0",
    "slowapi==0.1.9",
    "rasterio==1.4.4",
    "rioxarray==0.17.0",
    "rio-tiler==7.8.1",
    "scikit-learn==1.6.1",
    "sqlalchemy==2.0.41",
    "starlette==1.3.1",
    "torch==2.12.1",
    "torchvision==0.27.1",
    # Required by the FastSAM raster object path. Without this package the live
    # house/road/tree mask route falls back to the lightweight raster screener.
    "ultralytics==8.4.78",
    "onnxruntime==1.31.0",
    # [standard] keeps uvloop/httptools for the app server; they used to come in
    # only through dagster-webserver, which is no longer a dependency.
    "uvicorn[standard]==0.49.0",
    "workos==10.1.0",
    "xarray==2024.11.0",
]

[tool.basedpyright]
include = ["src"]

exclude = ["**/__pycache__", "**/.venv", "**/.mypy_cache", "**/.ruff_cache", "**/build", "**/dist"]

pythonVersion = "3.11"

baselineFile = ".basedpyright/baseline.json"

# can tighten later to "recommended"
typeCheckingMode = "standard"

# Many deps (osgeo/GDAL, dask) require C libs not available in CI
reportMissingImports = false

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# E402: module-level import not at top (many files use conditional / late imports)
# F401: imported but unused (re-exports, lazy imports)
# F841: local variable assigned but never used (WIP code)
# E741: ambiguous variable name (single-letter vars in math/geo code)
ignore = ["E402", "F401", "F841", "E741", "E702"]

[dependency-groups]
dev = [
    "basedpyright",
    "pytest-asyncio==1.4.0",
    "pytest-timeout==2.4.0",
    "pytest-xdist==3.8.0",
    "python-docx==1.1.2",
    "python-pptx==1.0.2",
]
