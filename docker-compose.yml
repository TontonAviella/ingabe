services:
  app:
    restart: unless-stopped
    container_name: mundi-app
    platform: linux/amd64
    image: "${APP_IMAGE:-mundi-public:local}"
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_WEBSITE_DOMAIN=http://localhost:8000
        - VITE_AUTH_PROVIDER=${AUTH_PROVIDER:-}
      x-bake:
        tags:
          - "${APP_IMAGE:-mundi-public:local}"
    ports:
      - "8000:8000"
    depends_on:
      minio:
        condition: service_healthy
      mc:
        condition: service_completed_successfully
      postgresdb:
        condition: service_healthy
      redis:
        condition: service_healthy
      rasterd:
        condition: service_started
      cache-init:
        condition: service_completed_successfully
    environment:
      - MUNDI_AUTH_MODE=edit # No-provider fallback: "edit" or "view_only"; ignored when AUTH_PROVIDER=workos
      # WorkOS sign-in (AUTH_PROVIDER=workos); see src/services/workos_auth.py
      - AUTH_PROVIDER=${AUTH_PROVIDER:-}
      - WORKOS_API_KEY=${WORKOS_API_KEY:-}
      - WORKOS_CLIENT_ID=${WORKOS_CLIENT_ID:-}
      - WORKOS_COOKIE_PASSWORD=${WORKOS_COOKIE_PASSWORD:-}
      - WORKOS_REDIRECT_URI=${WORKOS_REDIRECT_URI:-}
      - PLATFORM_ADMIN_EMAILS=${PLATFORM_ADMIN_EMAILS:-}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-s3user}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-changeme}
      - S3_DEFAULT_REGION=${S3_DEFAULT_REGION:-us-east-1}
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL:-http://minio:9000}
      - S3_PUBLIC_ENDPOINT_URL=${S3_PUBLIC_ENDPOINT_URL:-http://localhost:9000}
      - S3_BUCKET=${S3_BUCKET:-test-bucket}
      - WEBSITE_DOMAIN=${VITE_WEBSITE_DOMAIN:-http://localhost:8000}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - RASTER_TILE_ENGINE_URL=${RASTER_TILE_ENGINE_URL:-http://rasterd:8877}
      - RASTER_TILE_ENGINE_TIMEOUT=${RASTER_TILE_ENGINE_TIMEOUT:-30.0}
      - RASTER_TILE_ENGINE_CONCURRENCY=${RASTER_TILE_ENGINE_CONCURRENCY:-1}
      - RASTER_TILE_ENGINE_DIRECT_S3=${RASTER_TILE_ENGINE_DIRECT_S3:-1}
      - RASTER_COG_TARGET_SRS=${RASTER_COG_TARGET_SRS:-EPSG:3857}
      - RASTER_SOURCE_MAXZOOM=${RASTER_SOURCE_MAXZOOM:-20}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-ollama:gemma4:12b-it-qat}
      - LLM_CONTEXT_LIMIT=${LLM_CONTEXT_LIMIT:-131072}
      - OPENROUTER_FALLBACK_MODELS=${OPENROUTER_FALLBACK_MODELS:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434/v1}
      # Brain + Sage tool-shortlist embeddings (nomic-embed-text). Empty =
      # OLLAMA_BASE_URL. On a Mac, http://host.docker.internal:11434 uses the
      # native Ollama (GPU): ~30 ms per query vs ~3 s on the CPU container.
      - BRAIN_EMBEDDINGS_BASE_URL=${BRAIN_EMBEDDINGS_BASE_URL:-}
      - BRAIN_EMBEDDINGS_KEEP_ALIVE=${BRAIN_EMBEDDINGS_KEEP_ALIVE:-24h}
      - SAGE_SMALL_TALK_MODEL=${SAGE_SMALL_TALK_MODEL:-ollama:gemma4:12b-it-qat}
      # Looks at each drone plot for the question cards (src/services/drone_vision.py).
      - DRONE_VISION_MODEL=${DRONE_VISION_MODEL:-openai/gpt-6-luna}
      # Hermes planner: off by default. `auto` turns it on only when OPENROUTER_API_KEY is set.
      - MUNDI_USE_HERMES=${MUNDI_USE_HERMES:-0}
      # Retry once with a tool when Sage answers in prose but a tool fits (src/dependencies/sage_turn_request.py).
      - SAGE_ABDICATION_GUARD=${SAGE_ABDICATION_GUARD:-0}
      - MUNDI_TOOL_CALL_ENABLED=${MUNDI_TOOL_CALL_ENABLED:-0}
      - MUNDI_RASTER_OBJECT_MAX_SAMPLE_PIXELS=${MUNDI_RASTER_OBJECT_MAX_SAMPLE_PIXELS:-}
      - HERMES_GATEWAY_SECRET=${HERMES_GATEWAY_SECRET:-}
      - MUNDI_APP_URL=${MUNDI_APP_URL:-http://app:8000}
      - HOME=/home/appuser  # so ~/.hermes/ resolves inside the container
      - XDG_CACHE_HOME=${XDG_CACHE_HOME:-/cache}
      - MPLCONFIGDIR=${MPLCONFIGDIR:-/cache/matplotlib}
      - TORCH_HOME=${TORCH_HOME:-/cache/torch}
      - YOLO_CONFIG_DIR=${YOLO_CONFIG_DIR:-/cache/ultralytics}
      - PIPELINE_EVIDENCE_PATH=${PIPELINE_EVIDENCE_PATH:-/tmp/ingabe_cache/pipeline_evidence.json}
      - HERMES_ACCEPT_HOOKS=1
      # Default stays 4 (main's value) so a deploy whose env does not set it
      # keeps its capacity. The local Mac runtime sets UVICORN_WORKERS=1 in
      # .env (see .env.example) to avoid multiplying schedulers and ML memory.
      - UVICORN_WORKERS=${UVICORN_WORKERS:-4}
      - MUNDI_BACKGROUND_WORKERS_ENABLED=${MUNDI_BACKGROUND_WORKERS_ENABLED:-1}
      - DB_POOL_MAX_SIZE=${DB_POOL_MAX_SIZE:-10}
      - DB_READ_POOL_MAX_SIZE=${DB_READ_POOL_MAX_SIZE:-10}
      - POSTGRES_HOST=${POSTGRES_HOST:-postgresdb}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DB=${POSTGRES_DB:-mundidb}
      - POSTGRES_USER=${POSTGRES_USER:-mundiuser}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - OTEL_EXPORTER_OTLP_HEADERS=${OTEL_EXPORTER_OTLP_HEADERS:-}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-ingabe}
      # Sage flight recorder (src/services/sage_flight_recorder.py). Empty
      # keys = tracing off. Point LANGFUSE_HOST at a Langfuse instance to use it.
      - LANGFUSE_HOST=${LANGFUSE_HOST:-http://langfuse-web:3000}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}
      - LANGFUSE_TRACING_ENVIRONMENT=${LANGFUSE_TRACING_ENVIRONMENT:-local}
      - POSTHOG_API_KEY=${POSTHOG_API_KEY:-phc_W7tOZXWc5oPtpiYyyINii49GodL1NgyS6z30pNW8aTP}
      - POSTHOG_HOST=${POSTHOG_HOST:-https://us.i.posthog.com}
      - POSTHOG_BACKEND_DISABLED=${POSTHOG_BACKEND_DISABLED:-0}
      - PYTHONUNBUFFERED=1
      - PYTHONIOENCODING=utf-8
      - POSTGIS_LOCALHOST_POLICY=docker_rewrite
      - CDSAPI_URL=${CDSAPI_URL:-https://cds.climate.copernicus.eu/api}
      - CDSAPI_KEY=${CDSAPI_KEY:-}
      # Rate limiting
      - RATE_LIMIT_ENABLED=${RATE_LIMIT_ENABLED:-true}
      - RATE_LIMIT_EXPENSIVE=${RATE_LIMIT_EXPENSIVE:-20/minute}
      - RATE_LIMIT_HEAVY=${RATE_LIMIT_HEAVY:-10/minute}
      - RATE_LIMIT_GENERAL=${RATE_LIMIT_GENERAL:-120/minute}
      # Read replica (set to route SELECT queries to replica; omit to use primary for all)
      # - POSTGRES_READ_HOST=postgresdb-replica
      # - POSTGRES_READ_PORT=5432
      # Dask raster pipeline (uses synchronous scheduler by default)
      # - DASK_SCHEDULER_ADDRESS=tcp://dask-scheduler:8786
      # - RASTER_EAGER_COG=false  # Disable upload-time COG generation (default: true)
      # Tile cache (Redis, enabled by default)
      # - TILE_CACHE_ENABLED=true
      # - TILE_CACHE_TTL=3600  # seconds
      # - OPENAI_BASE_URL=http://host.docker.internal:11434/v1
      # - OPENAI_API_KEY=ollama
      # - OPENAI_MODEL=ollama:gemma4:12b-it-qat
      #-  MUNDI_EMBED_ALLOWED_ORIGINS=http://localhost:4321
    command: >
      bash -c "bash /app/scripts/start-services.sh"
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
      - ./alembic:/app/alembic
      - ./conftest.py:/app/conftest.py
      - ./pytest.ini:/app/pytest.ini
      - ./FastSAM-s.pt:/app/FastSAM-s.pt:ro
      - ./docs:/app/docs
      - ./scripts:/app/scripts
      - ./evals:/app/evals
      - ./hermes_integration:/app/hermes_integration
      - ingabe-cache:/tmp/ingabe_cache

  cache-init:
    image: "${APP_IMAGE:-mundi-public:local}"
    user: root
    command: >
      bash -c "mkdir -p /tmp/ingabe_cache && chown -R appuser:appuser /tmp/ingabe_cache"
    volumes:
      - ingabe-cache:/tmp/ingabe_cache

  dagster-home-init:
    image: "${APP_IMAGE:-mundi-public:local}"
    user: root
    command: >
      bash -c "mkdir -p /app/dagster_home/storage && chown -R appuser:appuser /app/dagster_home/storage"
    volumes:
      - dagster-home:/app/dagster_home

  minio:
    image: bitnamilegacy/minio:latest
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-admin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-changeme}
      - MINIO_DEFAULT_BUCKETS=${S3_BUCKET:-test-bucket}
    volumes:
      - ./data/minio:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 1s
      timeout: 2s
      retries: 10

  mc:
    image: ${MC_IMAGE:-bitnamilegacy/minio:latest}
    depends_on:
      minio:
        condition: service_healthy
    # Idempotent bootstrap: every step is safe on re-run.
    # `mc admin user add` errors on existing user; `mc ilm rule add` errors on
    # duplicate prefix. The previous version masked both with `2>/dev/null || echo`,
    # which hid genuine failures and printed misleading success messages.
    entrypoint: >
      /bin/sh -c "
      set -e;
      MC=/opt/bitnami/minio-client/bin/mc;
      if [ ! -x $$MC ] && [ -x /usr/bin/mc ]; then MC=/usr/bin/mc; fi;
      $$MC alias set myminio http://minio:9000 ${MINIO_ROOT_USER:-admin} ${MINIO_ROOT_PASSWORD:-changeme};
      if $$MC admin user info myminio ${S3_ACCESS_KEY_ID:-s3user} >/dev/null 2>&1; then
        echo '[mc] user ${S3_ACCESS_KEY_ID:-s3user} already exists';
      else
        $$MC admin user add myminio ${S3_ACCESS_KEY_ID:-s3user} ${S3_SECRET_ACCESS_KEY:-changeme};
        echo '[mc] created user ${S3_ACCESS_KEY_ID:-s3user}';
      fi;
      $$MC admin policy attach myminio readwrite --user ${S3_ACCESS_KEY_ID:-s3user} >/dev/null 2>&1 || true;
      echo '[mc] policy readwrite ensured on ${S3_ACCESS_KEY_ID:-s3user}';
      printf '%s\n' '<CORSConfiguration><CORSRule><AllowedOrigin>http://localhost:5173</AllowedOrigin><AllowedOrigin>http://localhost:8000</AllowedOrigin><AllowedMethod>GET</AllowedMethod><AllowedMethod>PUT</AllowedMethod><AllowedMethod>POST</AllowedMethod><AllowedMethod>HEAD</AllowedMethod><AllowedHeader>*</AllowedHeader><ExposeHeader>ETag</ExposeHeader><MaxAgeSeconds>3000</MaxAgeSeconds></CORSRule></CORSConfiguration>' > /tmp/mundi-cors.xml;
      $$MC cors set myminio/${S3_BUCKET:-test-bucket} /tmp/mundi-cors.xml && echo '[mc] CORS policy ensured for browser uploads' || echo '[mc] CORS policy unsupported; browser uploads use backend proxy';
      RULES=$$($$MC ilm rule list myminio/${S3_BUCKET:-test-bucket} 2>/dev/null) || RULES='';
      case $$RULES in
        *snapshots/*) echo '[mc] lifecycle rule for snapshots/ already present';;
        *) $$MC ilm rule add --expire-days 1 --prefix snapshots/ myminio/${S3_BUCKET:-test-bucket} && echo '[mc] added lifecycle rule: snapshots/ -> expire after 1 day' || echo '[mc] lifecycle rule unsupported; snapshots cleanup must be handled externally';;
      esac;
      echo '[mc] bootstrap complete';
      "

  postgresdb:
    restart: unless-stopped
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile.postgres
    image: mundi-postgres:local
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-mundidb}
      - POSTGRES_USER=${POSTGRES_USER:-mundiuser}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mundiuser -d mundidb"]
      interval: 1s
      timeout: 5s
      retries: 10


  redis:
    restart: unless-stopped
    image: ${REDIS_IMAGE:-redis:alpine}
    command: redis-server --protected-mode no --maxmemory 2gb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 2s
      retries: 5

  rasterd:
    build:
      context: ./services/rasterd
      dockerfile: Dockerfile
      args:
        - RASTERD_CARGO_FEATURES=${RASTERD_CARGO_FEATURES:-}
    image: mundi-rasterd:local
    container_name: mundi-rasterd
    ports:
      - "${RASTERD_PORT:-8877}:8877"
    environment:
      - RUST_LOG=${RASTERD_RUST_LOG:-info}
      - RASTERD_TILE_CACHE_ENTRIES=${RASTERD_TILE_CACHE_ENTRIES:-4096}
      - RASTERD_RENDER_CONCURRENCY=${RASTERD_RENDER_CONCURRENCY:-1}
      - AWS_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-s3user}
      - AWS_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-changeme}
      - AWS_REGION=${S3_DEFAULT_REGION:-us-east-1}
      - AWS_S3_ENDPOINT=${RASTERD_AWS_S3_ENDPOINT:-minio:9000}
      - AWS_HTTPS=${RASTERD_AWS_HTTPS:-NO}
      - AWS_VIRTUAL_HOSTING=${RASTERD_AWS_VIRTUAL_HOSTING:-FALSE}
      - GDAL_NUM_THREADS=1
      - OMP_NUM_THREADS=1
      - GDAL_DISABLE_READDIR_ON_OPEN=EMPTY_DIR
      - CPL_VSIL_CURL_ALLOWED_EXTENSIONS=.tif,.tiff
      - GDAL_HTTP_MULTIRANGE=YES
      - GDAL_HTTP_MERGE_CONSECUTIVE_RANGES=YES
      - CPL_VSIL_CURL_CACHE_SIZE=134217728
      - VSI_CACHE=TRUE
      - VSI_CACHE_SIZE=134217728
      - GDAL_CACHEMAX=256
    restart: unless-stopped

  # --- Optional: PostgreSQL read replica (uncomment to scale read-heavy workloads) ---
  # Requires the primary to have wal_level=replica (default in PostgreSQL 10+).
  # For production, use your cloud provider's managed read replica (RDS, Cloud SQL)
  # and set POSTGRES_READ_HOST in the app environment instead.
  #
  # postgresdb-replica:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile.postgres
  #   image: mundi-postgres:local
  #   environment:
  #     - POSTGRES_DB=mundidb
  #     - POSTGRES_USER=mundiuser
  #     - POSTGRES_PASSWORD=gdalpassword
  #     - POSTGRES_PRIMARY_HOST=postgresdb
  #     - POSTGRES_PRIMARY_PORT=5432
  #   depends_on:
  #     postgresdb:
  #       condition: service_healthy
  #   volumes:
  #     - ./data/postgres-replica:/var/lib/postgresql/data
  #   command: >
  #     bash -c "
  #     if [ ! -f /var/lib/postgresql/data/PG_VERSION ]; then
  #       rm -rf /var/lib/postgresql/data/*;
  #       PGPASSWORD=$$POSTGRES_PASSWORD pg_basebackup
  #         -h $$POSTGRES_PRIMARY_HOST -p $$POSTGRES_PRIMARY_PORT
  #         -U $$POSTGRES_USER -D /var/lib/postgresql/data -Fp -Xs -R;
  #     fi;
  #     exec postgres -c hot_standby=on
  #     "
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U mundiuser -d mundidb"]
  #     interval: 1s
  #     timeout: 5s
  #     retries: 10

  # --- Optional: Dask distributed scheduler (uncomment to scale raster processing) ---
  # dask-scheduler:
  #   image: "${APP_IMAGE:-mundi-public:local}"
  #   command: dask scheduler
  #   ports:
  #     - "8786:8786"   # scheduler port
  #     - "8787:8787"   # dashboard
  #
  # dask-worker:
  #   image: "${APP_IMAGE:-mundi-public:local}"
  #   command: dask worker tcp://dask-scheduler:8786 --nworkers 2 --nthreads 2
  #   depends_on:
  #     - dask-scheduler
  #   environment:
  #     - S3_ACCESS_KEY_ID=s3user
  #     - S3_SECRET_ACCESS_KEY=backup123
  #     - S3_DEFAULT_REGION=us-east-1
  #     - S3_ENDPOINT_URL=http://minio:9000
  #     - S3_BUCKET=test-bucket

  # --- Dagster pipeline orchestration ---
  # dagster-webserver removed — monitor via: dagster run list / dagster run logs <run_id>

  dagster-daemon:
    image: "${APP_IMAGE:-mundi-public:local}"
    container_name: mundi-dagster-daemon
    # 1. Fail runs orphaned by the previous container: they would otherwise
    #    hold the single run slot (dagster.yaml max_concurrent_runs) forever.
    # 2. Start one code server (workspace.yaml) and the daemon. If either
    #    exits, the container exits and `restart` brings both back, so the
    #    daemon never runs against an unreachable code server (2026-08-12).
    command:
      - bash
      - -c
      - |
        python -m src.pipelines.fail_orphaned_runs || exit 1
        trap 'kill -TERM $$(jobs -p) 2>/dev/null; wait' TERM INT
        dagster api grpc -m src.pipelines -a defs -d /app --host 127.0.0.1 --port 4266 &
        dagster-daemon run -w /app/dagster_home/workspace.yaml &
        wait -n
        echo "dagster-daemon: a process exited; stopping the container so it restarts" >&2
        kill -TERM $$(jobs -p) 2>/dev/null
        exit 1
    # Runs execute as subprocesses inside this container, so this cap bounds
    # the daemon plus its runs: an over-budget run is killed here instead of
    # pushing the Docker VM into swap and crashing Postgres (2026-10-03).
    # Measured 2026-10-04: the daemon idles at ~0.95 GB (two gRPC code servers
    # + daemon) and one run adds up to ~0.8 GB (field NDVI 764 MB), so 1.5 GB
    # OOM-killed every real job.
    mem_limit: 2048m
    memswap_limit: 2048m
    restart: unless-stopped
    depends_on:
      postgresdb:
        condition: service_healthy
      minio:
        condition: service_healthy
      cache-init:
        condition: service_completed_successfully
      dagster-home-init:
        condition: service_completed_successfully
    environment:
      - DAGSTER_HOME=/app/dagster_home
      - DAGSTER_PG_URL=postgresql://${POSTGRES_USER:-mundiuser}:${POSTGRES_PASSWORD:-changeme}@${POSTGRES_HOST:-postgresdb}:${POSTGRES_PORT:-5432}/dagster
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-s3user}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-changeme}
      - S3_DEFAULT_REGION=${S3_DEFAULT_REGION:-us-east-1}
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL:-http://minio:9000}
      - S3_BUCKET=${S3_BUCKET:-test-bucket}
      - POSTGRES_HOST=${POSTGRES_HOST:-postgresdb}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DB=${POSTGRES_DB:-mundidb}
      - POSTGRES_USER=${POSTGRES_USER:-mundiuser}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      - CDSAPI_URL=${CDSAPI_URL:-https://cds.climate.copernicus.eu/api}
      - CDSAPI_KEY=${CDSAPI_KEY:-}
      - PIPELINE_EVIDENCE_PATH=${PIPELINE_EVIDENCE_PATH:-/tmp/ingabe_cache/pipeline_evidence.json}
    volumes:
      - ./src:/app/src
      - dagster-home:/app/dagster_home
      - ./dagster.yaml:/app/dagster_home/dagster.yaml
      - ./workspace.yaml:/app/dagster_home/workspace.yaml
      - ingabe-cache:/tmp/ingabe_cache

  # --- Monitoring stack (Prometheus + Grafana) ---
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: mundi-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
    restart: unless-stopped

  # Database and Docker-VM health for Prometheus/Grafana. On 2026-10-03
  # Postgres looped through crash recovery for ~30 min under VM memory
  # pressure and nothing showed it; pg_up and MemAvailable/swap now do.
  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    container_name: mundi-postgres-exporter
    mem_limit: 64m
    # Custom metrics (pipeline cache freshness); see the file's header.
    command: ["--extend.query-path=/etc/postgres_exporter/queries.yaml"]
    volumes:
      - ./monitoring/postgres_exporter_queries.yaml:/etc/postgres_exporter/queries.yaml:ro
    environment:
      - DATA_SOURCE_URI=${POSTGRES_HOST:-postgresdb}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-mundidb}?sslmode=disable
      - DATA_SOURCE_USER=${POSTGRES_USER:-mundiuser}
      - DATA_SOURCE_PASS=${POSTGRES_PASSWORD:-changeme}
    depends_on:
      - postgresdb
    restart: unless-stopped

  # Reads the Docker VM's own /proc (the VM is the memory budget every
  # container shares), not the Mac host's.
  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.8.2
    container_name: mundi-node-exporter
    mem_limit: 64m
    pid: host
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--collector.disable-defaults"
      - "--collector.meminfo"
      - "--collector.pressure"
      - "--collector.loadavg"
      - "--collector.cpu"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    container_name: mundi-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

  # --- Database backup (pg_dump → gzip → S3/MinIO) ---
  backup:
    image: alpine:3.21
    container_name: mundi-backup
    depends_on:
      postgresdb:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      - POSTGRES_HOST=${POSTGRES_HOST:-postgresdb}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DB=${POSTGRES_DB:-mundidb}
      - POSTGRES_USER=${POSTGRES_USER:-mundiuser}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL:-http://minio:9000}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-s3user}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-changeme}
      - S3_BUCKET=${S3_BUCKET:-test-bucket}
      - BACKUP_RETENTION_DAYS=${BACKUP_RETENTION_DAYS:-7}
      - BACKUP_CRON=${BACKUP_CRON:-0 2 * * *}
    volumes:
      - ./scripts/backup.sh:/backup.sh:ro
    entrypoint:
      - /bin/sh
      - -c
      - |
        # MinIO no longer serves mc downloads (410); alpine packages it as mcli.
        apk add --no-cache postgresql16-client bash minio-client &&
        ln -sf /usr/bin/mcli /usr/local/bin/mc &&
        echo "$$BACKUP_CRON /bin/bash /backup.sh >> /var/log/backup.log 2>&1" > /etc/crontabs/root &&
        echo "[backup] Cron scheduled: $$BACKUP_CRON — running initial backup" &&
        { /bin/bash /backup.sh || echo "[backup] initial backup FAILED; the nightly cron still runs"; } &&
        crond -f -l 2
    restart: unless-stopped

volumes:
  dagster-home:
  ingabe-cache:
  prometheus-data:
  grafana-data:
