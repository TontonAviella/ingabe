# Dagster instance configuration
# Used by both dagster-webserver and dagster-daemon

storage:
  postgres:
    postgres_url:
      env: DAGSTER_PG_URL

run_launcher:
  module: dagster.core.launcher
  class: DefaultRunLauncher

# Queue runs and execute one at a time: after downtime every schedule fires at
# once, and parallel runs exceed the daemon's mem_limit (docker-compose.yml).
run_coordinator:
  module: dagster.core.run_coordinator
  class: QueuedRunCoordinator
  config:
    max_concurrent_runs: 1

telemetry:
  enabled: false

retention:
  schedule:
    purge_after_days: 30
  sensor:
    purge_after_days: 30
