# Prometheus configuration for Mundi.ai
# Scrapes the app's /metrics (internal only), the exporters, and checks the public address from outside.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

# Firing and fixed alarms go to Alertmanager, which pushes them to Roger's phone (monitoring/alertmanager.yml).
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: "mundi-app"
    metrics_path: /metrics
    static_configs:
      - targets: ["app:8000"]
        labels:
          service: "ingabe"
          environment: "development"
    scrape_interval: 10s

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "postgres"
    static_configs:
      - targets: ["postgres-exporter:9187"]
    scrape_interval: 10s

  - job_name: "docker-vm"
    static_configs:
      - targets: ["node-exporter:9100"]

  # The app as people reach it: public address, Cloudflare tunnel, /api/health must say "healthy".
  # (A local stack probes the live site too; it only reads.)
  - job_name: "public-app"
    metrics_path: /probe
    params:
      module: [app_health]
    scrape_interval: 60s
    scrape_timeout: 20s
    static_configs:
      - targets: ["https://gis.nozalabs.rw/api/health"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: "dagster"
    static_configs:
      - targets: ["postgres-exporter-dagster:9187"]
    scrape_interval: 30s

  # Alertmanager itself: if it stops, phone alarms stop; MonitoringTargetDown then shows in the morning check.
  - job_name: "alertmanager"
    static_configs:
      - targets: ["alertmanager:9093"]

  # Redis, MinIO storage, and the monitoring tools themselves. (Container state arrives through node-exporter's
  # textfile, written by container-watch.)
  - job_name: "redis"
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: "minio"
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: ["minio:9000"]
    scrape_interval: 60s

  - job_name: "grafana"
    static_configs:
      - targets: ["grafana:3000"]
    scrape_interval: 60s

  - job_name: "tempo"
    static_configs:
      - targets: ["tempo:3200"]
    scrape_interval: 60s

  - job_name: "loki"
    static_configs:
      - targets: ["loki:3100"]
    scrape_interval: 60s

  - job_name: "alloy"
    static_configs:
      - targets: ["alloy:12345"]
    scrape_interval: 60s
