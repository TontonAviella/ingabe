# Prometheus configuration for Mundi.ai
# Scrapes the app's /metrics (internal only), the exporters, and checks the public address from outside.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: "mundi-app"
    metrics_path: /metrics
    static_configs:
      - targets: ["app:8000"]
        labels:
          service: "ingabe"
          environment: "development"
    scrape_interval: 10s

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "postgres"
    static_configs:
      - targets: ["postgres-exporter:9187"]
    scrape_interval: 10s

  - job_name: "docker-vm"
    static_configs:
      - targets: ["node-exporter:9100"]

  # The app as people reach it: public address, Cloudflare tunnel, /api/health must say "healthy".
  # (A local stack probes the live site too; it only reads.)
  - job_name: "public-app"
    metrics_path: /probe
    params:
      module: [app_health]
    scrape_interval: 60s
    scrape_timeout: 20s
    static_configs:
      - targets: ["https://gis.nozalabs.rw/api/health"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: "dagster"
    static_configs:
      - targets: ["postgres-exporter-dagster:9187"]
    scrape_interval: 30s
