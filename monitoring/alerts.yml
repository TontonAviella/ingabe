# Alert rules (Prometheus :9090/alerts, Grafana, and the Ingabe Health page). Every rule has an `area` label
# in the order problems are traced: 1 server, 2 containers, 3 database (data stores), 4 app + access,
# 5 sage, ai-model, maps, components, 6 dagster + data, 7 feeds, 8 backup, 9 monitoring and a `where` annotation saying
# where to look first. Added after 2026-10-03, when Postgres looped through
# crash recovery under Docker-VM memory pressure with nothing showing it.
groups:
  - name: database
    rules:
      - alert: PostgresUnavailable
        # Crash recovery refuses connections for 20-40 s; a 10 s scrape sees it.
        expr: pg_up{job="postgres"} == 0
        labels:
          severity: critical
          area: database
        annotations:
          where: "container ingabe-postgresdb-1 / mundi-postgresdb"
          summary: Postgres is not accepting connections (down or in crash recovery)
      - alert: PostgresRecoveredRecently
        # Any unavailability in the last 15 minutes, so a crash between
        # dashboard glances is not missed.
        expr: min_over_time(pg_up{job="postgres"}[15m]) == 0
        labels:
          severity: warning
          area: database
        annotations:
          where: "container postgresdb logs"
          summary: Postgres was unavailable at least once in the last 15 minutes

  - name: docker-vm
    rules:
      - alert: DockerVMMemoryLow
        expr: node_memory_MemAvailable_bytes < 1e9
        for: 5m
        labels:
          severity: warning
          area: server
        annotations:
          where: "server memory (Grafana: Server)"
          summary: Docker VM has under 1 GB available; Postgres workers start dying near here
      - alert: DockerVMSwapNearlyFull
        expr: (node_memory_SwapTotal_bytes - node_memory_SwapFree_bytes) / node_memory_SwapTotal_bytes > 0.85
        for: 5m
        labels:
          severity: warning
          area: server
        annotations:
          where: "server memory (Grafana: Server)"
          summary: Docker VM swap over 85% used (it was 96% when Postgres crash-looped)

  - name: data-pipelines
    rules:
      - alert: DataPipelineStale
        # Caches Sage reads, filled by Dagster schedules (daily at 02:00/06:00
        # UTC, weekly on Mondays, monthly on the 1st). Thresholds allow one missed run plus slack.
        # Added 2026-10-04 after the daemon was dead for 7 weeks unnoticed.
        expr: |
          (pipeline_cache_age_seconds{cadence="daily"} > 2 * 86400)
          or (pipeline_cache_age_seconds{cadence="weekly"} > 9 * 86400)
          or (pipeline_cache_age_seconds{cadence="monthly"} > 35 * 86400)
        for: 30m
        labels:
          severity: warning
          area: data
        annotations:
          where: "Dagster job that fills {{ $labels.cache }}"
          summary: "{{ $labels.cache }} has not been refreshed by Dagster on schedule ({{ $labels.cadence }})"

  - name: app
    rules:
      - alert: AppUnreachable
        # Checked from outside through Cloudflare every minute; /api/health must say "healthy".
        expr: probe_success{job="public-app"} == 0
        for: 3m
        labels:
          severity: critical
          area: app
        annotations:
          where: "gis.nozalabs.rw: cloudflared on the host, container mundi-app, /api/health body"
          summary: The live app does not answer from outside, or reports its database or Redis down
      - alert: AppSlow
        expr: probe_duration_seconds{job="public-app"} > 3
        for: 10m
        labels:
          severity: warning
          area: app
        annotations:
          where: "container mundi-app (Grafana: App, Logs)"
          summary: The live app takes over 3 s to answer its health check
      - alert: AppProcessDown
        expr: up{job="mundi-app"} == 0
        for: 2m
        labels:
          severity: critical
          area: app
        annotations:
          where: "container mundi-app (docker logs mundi-app)"
          summary: The app container does not answer inside the server
      - alert: AppServerErrors
        expr: |
          (sum(increase(http_request_errors_total[15m])) / clamp_min(sum(increase(http_requests_total[15m])), 1)) > 0.05
          and sum(increase(http_requests_total[15m])) > 20
        for: 5m
        labels:
          severity: warning
          area: app
        annotations:
          where: "container mundi-app, 5xx in Grafana: Logs"
          summary: Over 5% of app requests failed with a server error in the last 15 minutes

  - name: sage
    rules:
      - alert: SageTurnsFailing
        # Failed turns plus turns ended by an AI-model error, over all turns in the last hour. Not counted: turns
        # cut off by a restart (outcome "cancelled", every deploy) and chats grown past the model's limit
        # (kind "context", the person's chat, not a fault).
        expr: |
          (
            (sum(increase(sage_turns_total{outcome="failed"}[1h])) or vector(0))
            + (sum(increase(sage_llm_errors_total{stage="final",kind!="context"}[1h])) or vector(0))
          ) / sum(increase(sage_turns_total[1h])) > 0.1
          and sum(increase(sage_turns_total[1h])) >= 3
        labels:
          severity: warning
          area: sage
        annotations:
          where: "src/routes/message_routes.py (process_chat_interaction_task), Grafana: Sage + Logs"
          summary: More than 1 in 10 Sage turns failed in the last hour
      - alert: SageTurnsLeftHanging
        expr: sum(increase(sage_turns_closed_unfinished_total[1h])) > 0
        labels:
          severity: warning
          area: sage
        annotations:
          where: "turns that ended without an answer (round limit, crash, restart); Grafana: Logs"
          summary: A Sage turn ended without an answer in the last hour
      - alert: SageSlow
        expr: |
          histogram_quantile(0.9, sum by (le) (rate(sage_turn_duration_seconds_bucket[1h]))) > 120
          and sum(increase(sage_turns_total[1h])) >= 3
        for: 15m
        labels:
          severity: warning
          area: sage
        annotations:
          where: "slow tools in Grafana: Sage (tool calls), AI model latency"
          summary: 1 in 10 Sage answers took over 2 minutes in the last hour
      - alert: SageToolTimingOut
        expr: sum by (tool) (increase(sage_tool_calls_total{outcome="timeout"}[1h])) >= 2
        labels:
          severity: warning
          area: sage
        annotations:
          where: "tool {{ $labels.tool }} (its data source is slow or down)"
          summary: "Sage tool {{ $labels.tool }} was stopped for taking too long twice in the last hour"

  - name: ai-model
    rules:
      - alert: AIModelCreditOrKeyRefused
        expr: sum(increase(sage_llm_errors_total{kind=~"credit|auth"}[30m])) > 0
        labels:
          severity: critical
          area: ai-model
        annotations:
          where: "AI provider account (credit balance or API key in .env)"
          summary: The AI model refused Sage for credit or the API key; Sage cannot answer
      - alert: AIModelErrors
        expr: sum(increase(sage_llm_errors_total{stage="final",kind!="context"}[1h])) >= 3
        labels:
          severity: warning
          area: ai-model
        annotations:
          where: "AI provider status, error kinds in Grafana: AI model"
          summary: The AI model failed 3 or more Sage turns in the last hour
      - alert: AICreditEndsSoon
        expr: (sage_llm_credit_expires_timestamp_seconds - time()) < 7 * 86400
        labels:
          severity: warning
          area: ai-model
        annotations:
          where: "SAGE_LLM_CREDIT_EXPIRES in .env; the provider's billing page"
          summary: The AI model's paid credit ends within 7 days; then Sage stops answering
      - alert: AICreditEndsVerySoon
        expr: (sage_llm_credit_expires_timestamp_seconds - time()) < 2 * 86400
        labels:
          severity: critical
          area: ai-model
        annotations:
          where: "SAGE_LLM_CREDIT_EXPIRES in .env; the provider's billing page"
          summary: The AI model's paid credit ends within 2 days

  - name: dagster
    rules:
      - alert: DagsterJobFailed
        expr: dagster_job_last_run_failed == 1
        labels:
          severity: warning
          area: dagster
        annotations:
          where: "Dagster job {{ $labels.job_name }} (container mundi-dagster-daemon, Grafana: Dagster + Logs)"
          summary: "The latest run of {{ $labels.job_name }} failed"
      - alert: DagsterRunStuck
        expr: dagster_runs_stuck > 0
        for: 10m
        labels:
          severity: warning
          area: dagster
        annotations:
          where: "container mundi-dagster-daemon (runs table in the dagster database)"
          summary: A Dagster run started over 3 hours ago and has not finished
      - alert: DagsterDaemonDown
        expr: dagster_daemon_heartbeat_age_seconds{daemon_type="SCHEDULER"} > 300
        for: 5m
        labels:
          severity: critical
          area: dagster
        annotations:
          where: "container mundi-dagster-daemon (recreate it when no run is going)"
          summary: The Dagster scheduler has not reported in for over 5 minutes; no schedule will run

  - name: backup
    rules:
      - alert: BackupFailed
        expr: backup_last_run_success == 0
        labels:
          severity: critical
          area: backup
        annotations:
          where: "container mundi-backup (/var/log/backup.log), scripts/backup.sh"
          summary: The last nightly database backup failed
      - alert: BackupMissing
        expr: time() - backup_last_success_timestamp_seconds > 26 * 3600
        labels:
          severity: critical
          area: backup
        annotations:
          where: "container mundi-backup (cron), scripts/backup.sh"
          summary: No good database backup in over 26 hours
      - alert: BackupNeverRecorded
        expr: absent(backup_last_run_timestamp_seconds)
        for: 26h
        labels:
          severity: warning
          area: backup
        annotations:
          where: "container mundi-backup (BACKUP_METRICS_DIR, health-textfile volume)"
          summary: The backup has written no health record for over 26 hours
      - alert: BackupShrank
        expr: backup_last_size_bytes < 0.5 * backup_previous_size_bytes
        labels:
          severity: warning
          area: backup
        annotations:
          where: "container mundi-backup; compare the two newest files in MinIO backups/"
          summary: The newest backup is less than half the size of the one before it

  - name: server
    rules:
      - alert: DiskNearlyFull
        expr: 1 - node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"} > 0.85
        for: 15m
        labels:
          severity: warning
          area: server
        annotations:
          where: "server disk: docker images and build cache (docker builder prune), MinIO photos"
          summary: The server disk is over 85% full

  - name: monitoring
    rules:
      - alert: MonitoringTargetDown
        expr: up{job=~"postgres|dagster|docker-vm|public-app|alertmanager|redis|minio|grafana|loki|alloy|tempo"} == 0
        for: 5m
        labels:
          severity: warning
          area: monitoring
        annotations:
          where: "exporter container for job {{ $labels.job }}"
          summary: "Prometheus cannot read {{ $labels.job }}, so its alerts are blind"

  - name: components
    rules:
      - alert: ComponentCheckFailing
        # src/dependencies/component_checks.py asks each part to do its job with a known answer. A failed check is
        # retried 2 minutes later and exports 0 only after two failures in a row. Outside feeds: an hour.
        expr: component_check_ok{tier=~"core|ai"} == 0
        for: 10m
        labels:
          severity: critical
          area: components
        annotations:
          where: "{{ $labels.component }}: detail at /internal/component-checks and in the app log (\"component check {{ $labels.check }} failed\")"
          summary: "{{ $labels.component }} is not doing its job (check {{ $labels.check }})"
      - alert: DataFeedCheckFailing
        expr: component_check_ok{tier="feed"} == 0
        for: 1h
        labels:
          severity: warning
          area: feeds
        annotations:
          where: "{{ $labels.component }}: the outside service; detail at /internal/component-checks"
          summary: "Outside data feed {{ $labels.component }} has failed its check for an hour"
      - alert: ComponentChecksNotRunning
        # Also when no check has ever reported (runner never started, Redis emptied, results unreadable).
        expr: |
          (time() - max(component_check_last_run_timestamp_seconds) > 1800)
          or absent(component_check_last_run_timestamp_seconds)
        for: 30m
        labels:
          severity: warning
          area: monitoring
        annotations:
          where: "container mundi-app (the component check loop; COMPONENT_CHECKS, Redis lock component_checks:runner)"
          summary: No component check has run for 30 minutes; the self-tests are blind

  - name: maps
    rules:
      - alert: MapsFailingForUsers
        # From people's browsers (frontendts/src/lib/mapHealth.ts): map errors against maps loaded, last hour.
        expr: |
          sum(increase(frontend_map_events_total{event=~"map_error|deck_error|webgl_lost"}[1h]))
            / clamp_min(sum(increase(frontend_map_events_total{event="map_load"}[1h])), 1) > 0.2
          and sum(increase(frontend_map_events_total{event="map_load"}[1h])) >= 3
        labels:
          severity: warning
          area: maps
        annotations:
          where: "MapLibre / deck.gl in the browser: Grafana Components (maps) and Logs; frontendts/src/components/MapLibreMap.tsx"
          summary: More than 1 in 5 maps opened in the last hour hit a map or 3D error
      - alert: MapTilesFailingForUsers
        expr: sum(increase(frontend_map_events_total{event="tile_error"}[1h])) >= 5
        labels:
          severity: warning
          area: maps
        annotations:
          where: "tile routes /api/layer/... and rasterd; Grafana Logs (container mundi-app, mundi-rasterd)"
          summary: People's maps reported 5 or more tile errors in the last hour (at most one per page a minute)

  # ---- Early warnings: the trend says something will break, before it does -------------------------------------
  - name: server-early-warning
    rules:
      - alert: DiskFullWithin7Days
        # Straight-line forecast from the last 24 hours of free disk space.
        expr: predict_linear(node_filesystem_avail_bytes{mountpoint="/"}[24h], 7 * 86400) < 0
        for: 1h
        labels:
          severity: warning
          area: server
        annotations:
          where: "server disk: docker images and build cache (docker builder prune), MinIO photos, Loki logs"
          summary: "At the current rate the server disk is full within 7 days"
      - alert: MemoryRunsOutWithin24Hours
        expr: predict_linear(node_memory_MemAvailable_bytes[6h], 86400) < 1e9 and node_memory_MemAvailable_bytes < 6e9
        for: 30m
        labels:
          severity: warning
          area: server
        annotations:
          where: "Grafana Server (memory), Components (which container grows)"
          summary: "Free memory is falling steadily; at this rate it runs out within a day"
      - alert: MemoryPressure
        # Share of time processes stalled waiting for memory (Linux pressure stall information).
        expr: rate(node_pressure_memory_waiting_seconds_total[5m]) > 0.1
        for: 15m
        labels:
          severity: warning
          area: server
        annotations:
          where: "Grafana Server; the biggest containers in Grafana Components"
          summary: "Programs are waiting for memory over 10% of the time; the server is slowing down"
      - alert: CPUOverloaded
        expr: node_load5 > 1.5 * scalar(count(node_cpu_seconds_total{mode="idle"}))
        for: 30m
        labels:
          severity: warning
          area: server
        annotations:
          where: "Grafana Server (CPU); a Dagster run or a stuck process"
          summary: "The server has had more work than its 8 cores for 30 minutes"
      - alert: CPUStolenByHost
        # A shared virtual server: Contabo's host gives our CPU time to other customers.
        expr: avg(rate(node_cpu_seconds_total{mode="steal"}[10m])) > 0.1
        for: 30m
        labels:
          severity: warning
          area: server
        annotations:
          where: "Contabo (the host is oversold); ask Contabo support or move the server"
          summary: "Over 10% of our CPU time is being taken by the hosting company's other machines"
      - alert: DiskBusy
        expr: max(rate(node_disk_io_time_seconds_total[10m])) > 0.9
        for: 30m
        labels:
          severity: warning
          area: server
        annotations:
          where: "Grafana Server (disk); backups, Dagster runs or Postgres"
          summary: "The server disk has been busy over 90% of the time for 30 minutes"
      - alert: ServerRestarted
        expr: changes(node_boot_time_seconds[1h]) > 0
        labels:
          severity: warning
          area: server
        annotations:
          where: "Contabo control panel (maintenance or crash); check that every container came back"
          summary: "The server restarted in the last hour"
      - alert: ServerClockWrong
        expr: node_timex_sync_status == 0
        for: 30m
        labels:
          severity: warning
          area: server
        annotations:
          where: "timedatectl on the server (NTP); a wrong clock breaks sign-in and scheduled jobs"
          summary: "The server clock is not synchronised"
      - alert: OpenFilesNearLimit
        expr: node_filefd_allocated / node_filefd_maximum > 0.8
        for: 15m
        labels:
          severity: warning
          area: server
        annotations:
          where: "the container with the most connections (Grafana Components)"
          summary: "The server is close to its limit of open files"

  - name: containers
    rules:
      # container-watch (scripts/container_watch.py) reads Docker every 30 s. Every rule below is silenced while its
      # reading is stale, so a stopped watcher raises one ContainerWatchStale alarm, not a burst of false ones.
      - alert: ContainerWatchStale
        expr: (time() - max(ingabe_container_watch_last_run_seconds) > 300) or absent(ingabe_container_watch_last_run_seconds)
        for: 10m
        labels:
          severity: warning
          area: monitoring
        annotations:
          where: "container mundi-container-watch (docker logs); it writes containers.prom to the health-textfile volume"
          summary: "The container watch has not read Docker for 5 minutes; container alarms are blind"
      - alert: ContainerRestarting
        # Each restart (by Docker's restart policy or a recreate) gives a new start time.
        expr: changes(ingabe_container_started_at_seconds[1h]) > 2 and on() (time() - ingabe_container_watch_last_run_seconds < 300)
        labels:
          severity: warning
          area: containers
        annotations:
          where: "docker logs {{ $labels.name }} on the server (Grafana Logs, container {{ $labels.name }})"
          summary: "Container {{ $labels.name }} restarted more than twice in the last hour"
      - alert: ContainerNearMemoryLimit
        expr: |
          ingabe_container_memory_bytes / (ingabe_container_memory_limit_bytes > 0) > 0.9 and on() (time() - ingabe_container_watch_last_run_seconds < 300)
        for: 15m
        labels:
          severity: warning
          area: containers
        annotations:
          where: "Grafana Health (Containers); raise mem_limit in docker-compose.yml or find the leak"
          summary: "Container {{ $labels.name }} uses over 90% of its memory limit; it will be killed when it reaches it"
      - alert: ContainerKilledOutOfMemory
        # Docker keeps the out-of-memory flag until the container starts again, so look back 30 minutes.
        expr: max_over_time(ingabe_container_oom_killed[30m]) == 1 and on() (time() - ingabe_container_watch_last_run_seconds < 300)
        labels:
          severity: critical
          area: containers
        annotations:
          where: "docker logs {{ $labels.name }}; raise its mem_limit in docker-compose.yml"
          summary: "Container {{ $labels.name }} ran out of memory and was killed"
      - alert: ContainerMissing_postgresdb
        # Absent or not running (exited, restarting, paused) for 5 minutes.
        expr: absent(ingabe_container_running{name=~".+-postgresdb-[0-9]+"} == 1) and on() (time() - ingabe_container_watch_last_run_seconds < 300)
        for: 5m
        labels:
          severity: critical
          area: containers
        annotations:
          where: "docker ps -a on the server; docker logs of the postgresdb container"
          summary: "The container for Postgres (the database) is not running"
      - alert: ContainerMissing_redis
        # Absent or not running (exited, restarting, paused) for 5 minutes.
        expr: absent(ingabe_container_running{name=~".+-redis-[0-9]+"} == 1) and on() (time() - ingabe_container_watch_last_run_seconds < 300)
        for: 5m
        labels:
          severity: critical
          area: containers
        annotations:
          where: "docker ps -a on the server; docker logs of the redis container"
          summary: "The container for Redis (cache and Sage counters) is not running"
      - alert: ContainerMissing_minio
        # Absent or not running (exited, restarting, paused) for 5 minutes.
        expr: absent(ingabe_container_running{name=~".+-minio-[0-9]+"} == 1) and on() (time() - ingabe_container_watch_last_run_seconds < 300)
        for: 5m
        labels:
          severity: critical
          area: containers
        annotations:
          where: "docker ps -a on the server; docker logs of the minio container"
          summary: "The container for MinIO (file storage: uploads, drone photos, backups) is not running"
      - alert: ContainerMissing_mundi_app
        # Absent or not running (exited, restarting, paused) for 5 minutes.
        expr: absent(ingabe_container_running{name=~"mundi-app"} == 1) and on() (time() - ingabe_container_watch_last_run_seconds < 300)
        for: 5m
        labels:
          severity: critical
          area: containers
        annotations:
          where: "docker ps -a on the server; docker logs of the mundi-app container"
          summary: "The container for the app itself is not running"
      - alert: ContainerMissing_dagster_daemon
        # Absent or not running (exited, restarting, paused) for 5 minutes.
        expr: absent(ingabe_container_running{name=~"mundi-dagster-daemon"} == 1) and on() (time() - ingabe_container_watch_last_run_seconds < 300)
        for: 5m
        labels:
          severity: warning
          area: containers
        annotations:
          where: "docker ps -a on the server; docker logs of the dagster-daemon container"
          summary: "The container for Dagster (scheduled data jobs) is not running"
      - alert: ContainerMissing_rasterd
        # Absent or not running (exited, restarting, paused) for 5 minutes.
        expr: absent(ingabe_container_running{name=~"mundi-rasterd"} == 1) and on() (time() - ingabe_container_watch_last_run_seconds < 300)
        for: 5m
        labels:
          severity: warning
          area: containers
        annotations:
          where: "docker ps -a on the server; docker logs of the rasterd container"
          summary: "The container for the raster tile server (map images) is not running"
      - alert: ContainerMissing_ollama
        # Absent or not running (exited, restarting, paused) for 5 minutes.
        expr: absent(ingabe_container_running{name=~".+-ollama-[0-9]+"} == 1) and on() (time() - ingabe_container_watch_last_run_seconds < 300)
        for: 5m
        labels:
          severity: warning
          area: containers
        annotations:
          where: "docker ps -a on the server; docker logs of the ollama container"
          summary: "The container for Ollama (Brain search embeddings) is not running"

  - name: data-stores
    rules:
      - alert: PostgresConnectionsNearLimit
        expr: sum(pg_stat_activity_count{job="postgres"}) / max(pg_settings_max_connections{job="postgres"}) > 0.8
        for: 10m
        labels:
          severity: warning
          area: database
        annotations:
          where: "Postgres connections (Grafana Database and backups); the app pool, Dagster, Grafana"
          summary: "Postgres is using over 80% of its allowed connections; new ones will soon be refused"
      - alert: PostgresDeadlocks
        expr: increase(pg_stat_database_deadlocks{job="postgres",datname="mundidb"}[1h]) > 0
        labels:
          severity: warning
          area: database
        annotations:
          where: "Postgres logs (Grafana Logs, container *postgresdb*)"
          summary: "Postgres had a deadlock in the last hour (two writes blocked each other)"
      - alert: RedisDown
        expr: redis_up == 0
        for: 2m
        labels:
          severity: critical
          area: database
        annotations:
          where: "container *redis* on the server"
          summary: "Redis is not answering (sign-in, Sage locks and counters, tile cache)"
      - alert: StorageNotHealthy
        expr: minio_cluster_health_status == 0
        for: 5m
        labels:
          severity: critical
          area: database
        annotations:
          where: "container *minio* on the server"
          summary: "MinIO file storage reports itself unhealthy"

  - name: public-access
    rules:
      - alert: CertificateExpiresSoon
        expr: (min(probe_ssl_earliest_cert_expiry{job="public-app"}) - time()) / 86400 < 14
        labels:
          severity: warning
          area: app
        annotations:
          where: "Cloudflare (SSL/TLS for nozalabs.rw); Cloudflare renews it, so this means renewal failed"
          summary: "The HTTPS certificate of gis.nozalabs.rw expires within 14 days"
      - alert: DomainExpiresSoon
        # nozalabs.rw is paid until 2027-09-11 (renewed through AOS, 12,711.87 RWF a year). Update the date after renewing.
        expr: vector(1820620800 - time()) / 86400 < 60
        labels:
          severity: warning
          area: app
        annotations:
          where: "the .rw registrar (AOS); then update the date in monitoring/alerts.yml"
          summary: "The domain nozalabs.rw expires within 60 days; the site and sign-in stop if it lapses"

  - name: monitoring-health
    rules:
      - alert: LogsNotArriving
        expr: sum(rate(loki_distributor_lines_received_total[15m])) == 0
        for: 30m
        labels:
          severity: warning
          area: monitoring
        annotations:
          where: "containers mundi-alloy and mundi-loki"
          summary: "No container logs have reached Loki for 30 minutes; Grafana Logs is blind"
      - alert: AlarmRulesFailing
        expr: increase(prometheus_rule_evaluation_failures_total[30m]) > 0
        labels:
          severity: warning
          area: monitoring
        annotations:
          where: "Prometheus rules (monitoring/alerts.yml); Prometheus logs"
          summary: "Some alarm rules could not be evaluated, so those alarms are blind"
      - alert: PhoneAlarmsFailing
        expr: increase(alertmanager_notifications_failed_total[1h]) > 0
        labels:
          severity: warning
          area: monitoring
        annotations:
          where: "containers mundi-alertmanager and mundi-alert-notifier (ntfy.sh reachable?)"
          summary: "Some alarms could not be delivered to your phone in the last hour"

  # Requests by route, from the traces (Tempo's span metrics, monitoring/tempo.yml): which page or API route fails or
  # is slow, not just "the app has errors".
  - name: requests
    rules:
      - alert: RouteServerErrors
        expr: |
          sum by (span_name) (increase(traces_spanmetrics_calls_total{span_kind="SPAN_KIND_SERVER",status_code="STATUS_CODE_ERROR"}[1h])) >= 3
        labels:
          severity: warning
          area: requests
        annotations:
          where: "Grafana Requests (route {{ $labels.span_name }}): open one of its failed traces, then its log lines"
          summary: "{{ $labels.span_name }} answered with a server error 3 or more times in the last hour"
      - alert: RouteSlow
        # Uploads are long by nature; everything else people wait for.
        expr: |
          histogram_quantile(0.95, sum by (span_name, le) (rate(traces_spanmetrics_latency_bucket{span_kind="SPAN_KIND_SERVER",span_name!~".*upload.*"}[1h]))) > 10
          and on (span_name) sum by (span_name) (increase(traces_spanmetrics_calls_total{span_kind="SPAN_KIND_SERVER"}[1h])) >= 5
        for: 15m
        labels:
          severity: warning
          area: requests
        annotations:
          where: "Grafana Requests (route {{ $labels.span_name }}): a slow trace shows which query or outside call took the time"
          summary: "{{ $labels.span_name }}: 1 in 20 requests took over 10 seconds in the last hour"
      - alert: TracesNotArriving
        # The public check (blackbox) requests /api/health every minute, so there is always something to trace.
        expr: (sum(rate(tempo_distributor_spans_received_total[30m])) or vector(0)) == 0
        for: 30m
        labels:
          severity: warning
          area: monitoring
        annotations:
          where: "container mundi-tempo; OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo:4318 in the server .env, then recreate the app"
          summary: "No request traces have arrived for 30 minutes; slow and failing requests can't be traced"

  # Errors in people's browsers (src/routes/client_health_routes.py /client-error, frontendts/src/lib/browserErrors.ts).
  - name: browsers
    rules:
      - alert: ScreenCrashedForSomeone
        expr: sum(increase(frontend_errors_total{kind=~"react_crash|app_init_failed"}[1h])) > 0
        labels:
          severity: warning
          area: browsers
        annotations:
          where: "Ingabe Health page, Errors in people's browsers (message, page, file and line); Grafana Logs, logger src.browser_errors"
          summary: "A screen of the app crashed in someone's browser in the last hour"
      - alert: ManyBrowserErrors
        expr: sum(increase(frontend_errors_total[1h])) >= 10
        labels:
          severity: warning
          area: browsers
        annotations:
          where: "Ingabe Health page, Errors in people's browsers; Grafana Logs, logger src.browser_errors"
          summary: "10 or more errors in people's browsers in the last hour"

  # Slow database queries (pg_stat_statements through postgres-exporter --collector.stat_statements).
  - name: database-queries
    rules:
      - alert: SlowDatabaseQuery
        expr: |
          (sum by (queryid) (increase(pg_stat_statements_seconds_total{datname="mundidb"}[1h]))
            / sum by (queryid) (increase(pg_stat_statements_calls_total{datname="mundidb"}[1h]))) > 5
          and sum by (queryid) (increase(pg_stat_statements_calls_total{datname="mundidb"}[1h])) >= 3
        labels:
          severity: warning
          area: database
        annotations:
          where: "Ingabe Health page, Slowest database queries (the query text); its traces in Grafana Requests"
          summary: "A database query took over 5 seconds on average, 3 or more times in the last hour"
      - alert: SlowQueryTrackingOff
        expr: absent(pg_stat_statements_calls_total)
        for: 30m
        labels:
          severity: warning
          area: monitoring
        annotations:
          where: "Postgres: shared_preload_libraries=pg_stat_statements (docker-compose.yml) and, as admin, CREATE EXTENSION pg_stat_statements in mundidb"
          summary: "Slow database queries are not being tracked"

  # People's ratings of Sage's answers (src/services/sage_answer_ratings.py).
  - name: sage-ratings
    rules:
      - alert: SageAnswersDisliked
        expr: sum(increase(sage_answer_ratings_total{rating="down"}[24h])) >= 3
        labels:
          severity: warning
          area: sage
        annotations:
          where: "Ingabe Health page, Sage: rated answers (the note, and the steps Sage took)"
          summary: "3 or more of Sage's answers were marked wrong in the last day"

