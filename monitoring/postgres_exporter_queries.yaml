# Custom postgres-exporter metrics (mounted via --extend.query-path).
#
# pipeline_cache_age_seconds: time since each Dagster-filled cache that Sage
# reads was last written. Added 2026-10-04: the Dagster daemon stopped on
# 2026-08-12 and nothing noticed for 7 weeks. An empty cache reports its age
# since the epoch, so it alerts too.
pipeline_cache:
  query: |
    SELECT 'agri_indices_cache' AS cache, 'daily' AS cadence,
           EXTRACT(EPOCH FROM now() - COALESCE(max(computed_at)::timestamptz, 'epoch')) AS age_seconds
      FROM agri_indices_cache
    UNION ALL
    SELECT 'weather_daily_cache', 'daily',
           EXTRACT(EPOCH FROM now() - COALESCE(max(computed_at)::timestamptz, 'epoch'))
      FROM weather_daily_cache
    UNION ALL
    SELECT 'drought_cache', 'weekly',
           EXTRACT(EPOCH FROM now() - COALESCE(max(computed_at)::timestamptz, 'epoch'))
      FROM drought_cache
    UNION ALL
    SELECT 'ndvi_cell_cache', 'weekly',
           EXTRACT(EPOCH FROM now() - COALESCE(max(computed_at)::timestamptz, 'epoch'))
      FROM ndvi_cell_cache
    UNION ALL
    -- Ground temperature: by the newest MODIS composite, not the last write (each run re-writes the last 16
    -- days, so writes continue even if MODIS stops). Composites normally arrive 2-3 weeks late, so the age counts
    -- from 38 days after the newest one: the weekly alert (9 days) then fires when it is over 47 days old.
    SELECT 'lst_district_8day', 'weekly',
           EXTRACT(EPOCH FROM now() - COALESCE((max(composite_start) + 38)::timestamptz, 'epoch'))
      FROM lst_district_8day
    UNION ALL
    -- Land cover per district/sector/cell, filled monthly (the source map is yearly).
    SELECT 'worldcover_admin_stats', 'monthly',
           EXTRACT(EPOCH FROM now() - COALESCE(max(computed_at), 'epoch'))
      FROM worldcover_admin_stats
  metrics:
    - cache:
        usage: LABEL
        description: Cache table name
    - cadence:
        usage: LABEL
        description: How often the Dagster schedule should refresh it (daily or weekly)
    - age_seconds:
        usage: GAUGE
        description: Seconds since the cache was last written (since the epoch when empty)

# sage_answer_ratings_*: Sage's answers people marked right (up) or wrong (down), one per person and answer however
# often they click (src/services/sage_answer_ratings.py). For the SageAnswersDisliked alarm and the Health page.
sage_answer_ratings:
  query: |
    SELECT rating,
           count(*) FILTER (WHERE updated_at > now() - interval '24 hours') AS last_24h,
           count(*) FILTER (WHERE updated_at > now() - interval '7 days') AS last_7d
      FROM sage_answer_ratings GROUP BY rating
  metrics:
    - rating:
        usage: "LABEL"
        description: "up or down"
    - last_24h:
        usage: "GAUGE"
        description: "Answers rated this way in the last 24 hours"
    - last_7d:
        usage: "GAUGE"
        description: "Answers rated this way in the last 7 days"

