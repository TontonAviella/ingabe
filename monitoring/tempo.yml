# Tempo: one trace per request to the app (src/wsgi.py TraceRequestMiddleware), with each database query and each
# call to an outside service inside it. Kept 7 days on the server's disk (volume tempo-data).
# Its metrics generator turns the traces into per-route numbers (calls, errors, time) and writes them to Prometheus
# (traces_spanmetrics_*), for the Routes alarms and panels; no code in the app counts routes.

stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 168h

metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true
  traces_storage:
    path: /var/tempo/generator/traces
  processor:
    span_metrics:
      # The answer's status code next to the route, so 4xx and 5xx can be told apart.
      dimensions:
        - http.response.status_code
      # Seconds; the slowest bucket is for Sage's long tools and big uploads.
      histogram_buckets: [0.05, 0.1, 0.25, 0.5, 1, 2.5, 5, 10, 30, 60, 120]

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

overrides:
  defaults:
    metrics_generator:
      processors: [span-metrics]
