# promtool test rules monitoring/alerts_test.yml
# Replays the 2026-10-03 incident: Postgres in crash recovery for ~30 s,
# Docker VM swap at 96% and under 1 GB available.
rule_files:
  - alerts.yml
evaluation_interval: 10s
tests:
  - interval: 10s
    input_series:
      - series: 'pg_up{job="postgres"}'
        values: '1 1 1 0 0 0 1 1 1 1 1 1'
      - series: 'node_memory_MemAvailable_bytes{job="docker-vm"}'
        values: '2e8x60'
      - series: 'node_memory_SwapTotal_bytes{job="docker-vm"}'
        values: '1073741824x60'
      - series: 'node_memory_SwapFree_bytes{job="docker-vm"}'
        values: '42949672x60'
    alert_rule_test:
      - eval_time: 40s
        alertname: PostgresUnavailable
        exp_alerts:
          - exp_labels: {severity: critical, job: postgres}
            exp_annotations: {summary: "Postgres is not accepting connections (down or in crash recovery)"}
      - eval_time: 100s
        alertname: PostgresUnavailable
        exp_alerts: []
      - eval_time: 100s
        alertname: PostgresRecoveredRecently
        exp_alerts:
          - exp_labels: {severity: warning, job: postgres}
            exp_annotations: {summary: "Postgres was unavailable at least once in the last 15 minutes"}
      - eval_time: 6m
        alertname: DockerVMMemoryLow
        exp_alerts:
          - exp_labels: {severity: warning, job: docker-vm}
            exp_annotations: {summary: "Docker VM has under 1 GB available; Postgres workers start dying near here"}
      - eval_time: 6m
        alertname: DockerVMSwapNearlyFull
        exp_alerts:
          - exp_labels: {severity: warning, job: docker-vm}
            exp_annotations: {summary: "Docker VM swap over 85% used (it was 96% when Postgres crash-looped)"}

  - interval: 1m
    input_series:
      - series: 'pipeline_cache_age_seconds{job="postgres",cache="agri_indices_cache",cadence="daily"}'
        values: '3600x60'
      - series: 'pipeline_cache_age_seconds{job="postgres",cache="weather_daily_cache",cadence="daily"}'
        values: '1.79e9x60'
      - series: 'pipeline_cache_age_seconds{job="postgres",cache="drought_cache",cadence="weekly"}'
        values: '691200x60'
      - series: 'pipeline_cache_age_seconds{job="postgres",cache="ndvi_cell_cache",cadence="weekly"}'
        values: '864000x60'
    alert_rule_test:
      - eval_time: 31m
        alertname: DataPipelineStale
        exp_alerts:
          - exp_labels: {severity: warning, job: postgres, cache: weather_daily_cache, cadence: daily}
            exp_annotations: {summary: "weather_daily_cache has not been refreshed by Dagster on schedule (daily)"}
          - exp_labels: {severity: warning, job: postgres, cache: ndvi_cell_cache, cadence: weekly}
            exp_annotations: {summary: "ndvi_cell_cache has not been refreshed by Dagster on schedule (weekly)"}
