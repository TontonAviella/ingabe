name: Lint

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  standards:
    # CODING_STANDARDS.md gate. Stdlib-only script; the baseline is a ratchet
    # and on PRs may not grow versus the base branch.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Test the gate
        run: |
          python -m pip install --quiet pytest
          python -m pytest tests/test_check_standards.py --noconftest -q -p no:cacheprovider

      - name: Check coding standards
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            python scripts/check_standards.py --base-ref "origin/$BASE_REF"
          else
            python scripts/check_standards.py
          fi

  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: astral-sh/ruff-action@4919ec5cf1f49eff0871dbcea0da843445b837e6 # v3
        with:
          src: "."
          # Pinned: unpinned, the action installs the latest ruff, and 0.16
          # enabled new rules that flag 3,383 findings in existing code. Upgrade
          # deliberately in its own PR.
          version: "0.15.21"

  biome:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Biome
        uses: biomejs/setup-biome@4c91541eaada48f67d7dbd7833600ce162b68f51 # v2
        with:
          version: "2.1.1"

      - name: Run Biome
        run: biome ci
        working-directory: frontendts/

  basedpyright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3

      - name: Install deps with uv
        run: uv sync --dev

      - name: Regenerate baseline for CI environment
        run: uv run basedpyright --writebaseline 2>/dev/null || true

      - name: Run basedpyright from project env
        run: uv run basedpyright
