name: CI/CD

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'Dockerfile.base'
      - 'noza-web/**'
      - '.github/workflows/build-base-image.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'Dockerfile.base'
      - 'noza-web/**'
      - '.github/workflows/build-base-image.yml'

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          # Keep swap: the root disk has >100 GB free after the cleanup above,
          # and swap is the margin that turns a memory spike into slowness
          # instead of an OOM-killed pytest worker.
          swap-storage: false

      - name: Report runner resources
        run: |
          df -h /
          nproc
          free -m

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build application images
        run: |
          python3 scripts/posthog_check_event.py --stage ci --check docker_build_app -- \
            docker buildx bake app \
            --set app.cache-from=type=gha \
            --set app.cache-to=type=gha,mode=max \
            --set app.args.VITE_WEBSITE_DOMAIN=http://localhost:8000 \
            --set app.args.VITE_POSTHOG_KEY=${{ secrets.VITE_POSTHOG_KEY }} \
            --set app.args.VITE_POSTHOG_HOST=https://us.i.posthog.com \
            --file docker-compose.yml \
            --load
        env:
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
          POSTHOG_HOST: https://us.i.posthog.com
        timeout-minutes: 45

      - name: Run tests
        # -n auto: conftest.py's pytest_xdist_auto_num_workers owns the worker
        # cap (min(4, cpus)); passing a number here bypassed it. The CI value
        # was 6. Each xdist worker imports the full FastAPI
        # app (~333 MB resident, ~7 s, measured 2026-10-02) and tests that
        # build a `TestClient(app)` re-run the lifespan on top of that, while
        # eight compose services share the same host. When memory runs out
        # the kernel SIGKILLs workers, which surfaces as
        # `[gwN] node down: Not properly terminated` with whatever test the
        # worker was running reported as FAILED (PR #57; PRs #77 and #78 on
        # 2026-10-02, all workers dying together right after startup).
        # The job runs on `ubuntu-latest` (4 vCPUs), so 6 workers only added
        # contention; the old comment's 16-core Depot runner is gone. The
        # step takes ~6 min of its 25 min budget, so 4 workers fit easily.
        # Never pass a number to -n here; change the cap in conftest.py.
        # If it recurs, the "Diagnose test-worker crashes" step below prints
        # the kernel's OOM/segfault lines for the run.
        #
        # --dist=loadfile: keep all tests in a single FILE on the same
        # worker. Several test files (tests/brain/test_org_context.py,
        # test_partner_isolation.py) share module-scoped fixtures that
        # create rows the later tests look up. The default dist=load
        # distributes individual tests across workers, so the create-row
        # test runs on gw0 with one RUN_TAG but the lookup test runs on
        # gw5 with a different RUN_TAG (each worker imports the module
        # fresh, generating a new uuid.uuid4() RUN_TAG at module top).
        # That made test_role_check_constraint /
        # test_cascade_delete_org_removes_memberships fail with
        # NotNullViolationError once the OOM cascade was fixed and the
        # tests actually had a chance to run. loadfile preserves the
        # author's intended same-worker test ordering inside each file.
        run: >
          python3 scripts/posthog_check_event.py --stage backend --check backend_pytest --
          docker compose run app pytest -vs -n auto --dist=loadfile --ignore=src/test_worldcover.py
        env:
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
          POSTHOG_HOST: https://us.i.posthog.com
        timeout-minutes: 25

      - name: Diagnose test-worker crashes
        # Evidence for `node down: Not properly terminated`: distinguishes an
        # OOM kill from a native crash (segfault) without guessing.
        if: failure()
        run: |
          free -m
          docker stats --no-stream || true
          sudo dmesg -T | grep -iE "out of memory|oom-kill|killed process|segfault|general protection" || echo "no OOM/segfault lines in dmesg"

      - name: Start services for E2E
        run: |
          docker compose up -d app
          # Wait for the app to be healthy
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/healthz > /dev/null 2>&1; then
              echo "App is healthy"
              break
            fi
            echo "Waiting for app to start... ($i/30)"
            sleep 2
          done
        timeout-minutes: 5

      - name: Install frontend dependencies
        working-directory: frontendts
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontendts
        run: npx playwright install --with-deps chromium

      - name: Run E2E smoke tests
        working-directory: frontendts
        run: ../scripts/posthog_check_event.py --stage e2e --check playwright_smoke -- npx playwright test --reporter=github
        env:
          E2E_BASE_URL: http://localhost:8000
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
          POSTHOG_HOST: https://us.i.posthog.com
        timeout-minutes: 5

      - name: Upload E2E artifacts on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: frontendts/test-results/
          retention-days: 7

      - name: Stop services
        if: always()
        run: docker compose down
