name: CI/CD

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'Dockerfile.base'
      - 'noza-web/**'
      - '.github/workflows/build-base-image.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'Dockerfile.base'
      - 'noza-web/**'
      - '.github/workflows/build-base-image.yml'

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Report disk space
        run: df -h /

      # Default (docker) builder: the image lands straight in the local image
      # store. The docker-container builder with a type=gha cache never got a
      # cache hit here and spent ~3 min exporting and re-loading the image.
      - name: Build application images
        run: |
          python3 scripts/posthog_check_event.py --stage ci --check docker_build_app -- \
            docker compose build app \
            --build-arg VITE_WEBSITE_DOMAIN=http://localhost:8000 \
            --build-arg VITE_POSTHOG_KEY=${{ secrets.VITE_POSTHOG_KEY }} \
            --build-arg VITE_POSTHOG_HOST=https://us.i.posthog.com
        env:
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
          POSTHOG_HOST: https://us.i.posthog.com
        timeout-minutes: 45

      - name: Run tests
        # -n auto: conftest.py's pytest_xdist_auto_num_workers owns the worker
        # cap (min(4, cpus)); passing a number here bypassed it. The CI value
        # was 6 on a 4-vCPU `ubuntu-latest` runner (the 16-core Depot runner
        # the old comment described is gone). The step takes ~6 min of its
        # 25 min budget. Never pass a number to -n here; change the cap in
        # conftest.py.
        #
        # `[gwN] node down: Not properly terminated` on every worker's first
        # test at exactly 60 s (PRs #77-#79, 2026-10-02) was NOT memory (the
        # diagnose step showed 13.8 GB free and no OOM in dmesg). It was
        # pytest-timeout (60 s, thread method => os._exit) firing while an
        # autouse fixture ran the migrations; conftest.py now migrates in
        # pytest_sessionstart, outside the per-test timeout.
        #
        # --dist=loadfile: keep all tests in a single FILE on the same
        # worker. Several test files (tests/brain/test_org_context.py,
        # test_partner_isolation.py) share module-scoped fixtures that
        # create rows the later tests look up. The default dist=load
        # distributes individual tests across workers, so the create-row
        # test runs on gw0 with one RUN_TAG but the lookup test runs on
        # gw5 with a different RUN_TAG (each worker imports the module
        # fresh, generating a new uuid.uuid4() RUN_TAG at module top).
        # That made test_role_check_constraint /
        # test_cascade_delete_org_removes_memberships fail with
        # NotNullViolationError once the OOM cascade was fixed and the
        # tests actually had a chance to run. loadfile preserves the
        # author's intended same-worker test ordering inside each file.
        run: >
          python3 scripts/posthog_check_event.py --stage backend --check backend_pytest --
          docker compose run -e MUNDI_TEST_DB_IS_DISPOSABLE=1 app pytest -vs -n auto --dist=loadfile --ignore=src/test_worldcover.py
        env:
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
          POSTHOG_HOST: https://us.i.posthog.com
        timeout-minutes: 25

      - name: Report disk space after tests
        if: always()
        run: df -h /

      - name: Diagnose test-worker crashes
        # Evidence for a failed test run: memory, container usage, and any
        # kernel OOM/segfault lines, so a worker crash is diagnosed from
        # facts. (This step is what ruled out OOM on 2026-10-02.)
        if: failure()
        run: |
          free -m
          docker stats --no-stream || true
          sudo dmesg -T | grep -iE "out of memory|oom-kill|killed process|segfault|general protection" || echo "no OOM/segfault lines in dmesg"

      - name: Start services for E2E
        run: |
          docker compose up -d app
          # Wait for the app to be healthy
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/healthz > /dev/null 2>&1; then
              echo "App is healthy"
              break
            fi
            echo "Waiting for app to start... ($i/30)"
            sleep 2
          done
        timeout-minutes: 5

      - name: Install frontend dependencies
        working-directory: frontendts
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontendts
        run: npx playwright install --with-deps chromium

      - name: Run E2E smoke tests
        working-directory: frontendts
        run: ../scripts/posthog_check_event.py --stage e2e --check playwright_smoke -- npx playwright test --reporter=github
        env:
          E2E_BASE_URL: http://localhost:8000
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
          POSTHOG_HOST: https://us.i.posthog.com
        timeout-minutes: 5

      - name: Upload E2E artifacts on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: frontendts/test-results/
          retention-days: 7

      - name: Stop services
        if: always()
        run: docker compose down
